name: Build Gershwin System

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-freebsd-14-amd64:
    name: FreeBSD x86_x64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          sync: rsync
          copyback: true
          cpu: 2
          mem: 4096
          prepare: |
            pkg update
            pkg install -y git tree squashfs-tools xorg-vfbserver xdpyinfo fontconfig ffmpeg xterm lcms2 sqlite
          run: |
            set -e
            ./Library/Scripts/bootstrap.sh
            ./Library/Scripts/checkout.sh
            make install
            # Capture the UI test result but do NOT let it abort this step: a
            # non-zero exit would stop vmactions from copying files (including
            # build/test-results/junit.xml) back to the runner.  The junit.xml
            # is published as a check run by the Publish UI test results step,
            # which fails the job on test failures.
            set +e
            sh Library/Scripts/run-uitests-debug.sh
            UITEST_RC=$?
            set -e
            mkdir -p artifacts/FreeBSD/14/amd64
            tar -C / -cJf artifacts/FreeBSD/14/amd64/system.txz /System
            TIMESTAMP=$(date +%y%m%d%H%M%S)
            mksquashfs /System artifacts/FreeBSD/14/amd64/Gershwin-FreeBSD-${TIMESTAMP}.squashfs -comp xz -b 1M
            find /System -type f -perm -111 -exec sh -c 'ldd "$1" 2>/dev/null | awk "/=>/ {print \$3}" | xargs -n1 pkg which 2>/dev/null | grep package | awk "{print \$6}" | sed "s/-[^-]*\$//"' sh {} \; | sort -u > artifacts/FreeBSD/14/amd64/Gershwin-FreeBSD-${TIMESTAMP}.dependencies
            cd artifacts/FreeBSD/14/amd64
            tree -h -D -C -H -./ --houtro=/dev/null -T 'Gershwin System for FreeBSD 14 amd64' ./ > ./index.html
            exit 0

      - uses: actions/upload-artifact@v6
        with:
          name: gershwin-freebsd-14-amd64
          path: artifacts/FreeBSD/14/amd64
          if-no-files-found: error

      # The JUnit report (build/test-results/junit.xml) is written by the
      # uitest harness and copied out of the VM by run-uitests.sh. Upload it
      # so CI consumers can download it without scraping the log.
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-freebsd-14-amd64
          path: build/test-results/*
          if-no-files-found: warn

      # Publish the JUnit report as a check run / PR annotation so the results
      # are visible in the Actions UI without downloading the artifact.
      - name: Publish UI test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: GNUstep UI tests (FreeBSD)
          path: build/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

  build-archlinux-x86_64:
    name: Arch x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: archlinux:latest
    steps:
      - name: Install build prerequisites
        run: |
          # Retry pacman: Arch mirrors occasionally 404 on freshly published
          # package versions, which previously broke the whole job (git ended
          # up missing, so the test-reporter below could not run).
          for attempt in 1 2 3 4 5; do
            pacman -Syu --noconfirm && pacman -S --noconfirm base-devel git tree squashfs-tools xorg-server-xvfb xorg-xdpyinfo procps-ng ffmpeg xterm lcms2 sqlite && break
            echo "pacman attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          pacman -Q git >/dev/null

      - uses: actions/checkout@v5

      - name: Bootstrap
        run: ./Library/Scripts/bootstrap.sh

      - name: Checkout sources
        run: ./Library/Scripts/checkout.sh

      - name: Build and install
        run: make install

      - name: Run UI tests
        run: sh Library/Scripts/run-uitests-debug.sh

      # The JUnit report (build/test-results/junit.xml) is written by the
      # uitest harness and copied out of the isolated session by run-uitests.sh.
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-archlinux-x86_64
          path: build/test-results/*
          if-no-files-found: warn

      # test-reporter runs git as root inside the container, but the workspace
      # was cloned by the runner user (uid 1001) - git refuses to touch it
      # ("dubious ownership"). --global is HOME-dependent and does not work in
      # container runs, so use the --system scope (/etc/gitconfig). Must also
      # run when the UI tests failed, hence the unconditional if: always().
      - name: Mark workspace as a git safe.directory
        if: always()
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # Publish the JUnit report as a check run / PR annotation so the results
      # are visible in the Actions UI without downloading the artifact.
      - name: Publish UI test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: GNUstep UI tests (Arch)
          path: build/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Package
        run: |
          mkdir -p artifacts/ArchLinux/x86_64
          tar -C / -cJf artifacts/ArchLinux/x86_64/system.txz /System
          export TIMESTAMP=$(date +%y%m%d%H%M%S)
          mksquashfs /System artifacts/ArchLinux/x86_64/Gershwin-ArchLinux-${TIMESTAMP}.squashfs -comp xz -b 1M
          find /System -type f -perm -111 -exec sh -c 'ldd "$1" 2>/dev/null | awk "/=>/ {print \$3}" | xargs -n1 pacman -Qo 2>/dev/null | awk "{print \$5}"' sh {} \; | sort -u > artifacts/ArchLinux/x86_64/Gershwin-ArchLinux-${TIMESTAMP}.dependencies

      - name: Build index
        run: |
          cd artifacts/ArchLinux/x86_64
          tree -h -D -C -H -./ --houtro=/dev/null -T 'Gershwin System for Arch Linux x86_64' ./ > ./index.html

      - uses: actions/upload-artifact@v6
        with:
          name: gershwin-archlinux-x86_64
          path: artifacts/ArchLinux/x86_64
          if-no-files-found: error

  build-debian-x86_64:
    name: Debian x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: debian:bookworm
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get -y install git tree squashfs-tools xvfb x11-utils procps ffmpeg xterm liblcms2-dev libsqlite3-dev

      - uses: actions/checkout@v5

      - name: Bootstrap
        run: ./Library/Scripts/bootstrap.sh

      - name: Checkout sources
        run: ./Library/Scripts/checkout.sh

      - name: Build and install
        run: make install

      - name: Run UI tests
        run: sh Library/Scripts/run-uitests-debug.sh

      # The JUnit report (build/test-results/junit.xml) is written by the
      # uitest harness and copied out of the isolated session by run-uitests.sh.
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-debian-x86_64
          path: build/test-results/*
          if-no-files-found: warn

      # test-reporter runs git as root inside the container, but the workspace
      # was cloned by the runner user (uid 1001) - git refuses to touch it
      # ("dubious ownership"). --global is HOME-dependent and does not work in
      # container runs, so use the --system scope (/etc/gitconfig). Must also
      # run when the UI tests failed, hence the unconditional if: always().
      - name: Mark workspace as a git safe.directory
        if: always()
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # Publish the JUnit report as a check run / PR annotation so the results
      # are visible in the Actions UI without downloading the artifact.
      - name: Publish UI test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: GNUstep UI tests (Debian)
          path: build/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Package
        run: |
          mkdir -p artifacts/Debian/x86_64
          tar -C / -cJf artifacts/Debian/x86_64/system.txz /System
          export TIMESTAMP=$(date +%y%m%d%H%M%S)
          mksquashfs /System artifacts/Debian/x86_64/Gershwin-Debian-${TIMESTAMP}.squashfs -comp xz -b 1M
          find /System -type f -perm -111 -exec sh -c 'ldd "$1" 2>/dev/null | awk "/=>/ {print \$3}" | xargs -n1 dpkg -S 2>/dev/null | cut -d: -f1' sh {} \; | sort -u > artifacts/Debian/x86_64/Gershwin-Debian-${TIMESTAMP}.dependencies

      - name: Build index
        run: |
          cd artifacts/Debian/x86_64
          tree -h -D -C -H -./ --houtro=/dev/null -T 'Gershwin System for Debian x86_64' ./ > ./index.html

      - uses: actions/upload-artifact@v6
        with:
          name: gershwin-debian-x86_64
          path: artifacts/Debian/x86_64
          if-no-files-found: error

  build-openbsd-78-amd64:
    name: OpenBSD x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      - name: Build inside OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.8"
          usesh: true
          sync: rsync
          copyback: true
          cpu: 2
          mem: 4096
          prepare: |
            pkg_add -I git tree xdpyinfo ffmpeg xterm lcms2 sqlite
          run: |
            set -e
            ./Library/Scripts/bootstrap.sh
            ./Library/Scripts/checkout.sh
            make install
            # Capture the UI test result but do NOT let it abort this step: a
            # non-zero exit would stop vmactions from copying files (including
            # build/test-results/junit.xml) back to the runner.  The junit.xml
            # is published as a check run by the Publish UI test results step,
            # which fails the job on test failures.
            set +e
            sh Library/Scripts/run-uitests-debug.sh
            UITEST_RC=$?
            set -e
            mkdir -p artifacts/OpenBSD/7.8/amd64
            # OpenBSD's base tar has no -J (xz); use -z (gzip), which it supports.
            tar -C / -czf artifacts/OpenBSD/7.8/amd64/system.tgz /System
            TIMESTAMP=$(date +%y%m%d%H%M%S)
            find /System -type f \( -perm -0100 -o -perm -0010 -o -perm -0001 \) \
              -exec ldd {} 2>/dev/null \; 2>/dev/null \
              | awk '/=>/ {print $3}' | grep -v 'not found' | sort -u \
              > artifacts/OpenBSD/7.8/amd64/Gershwin-OpenBSD-${TIMESTAMP}.dependencies || true
            cd artifacts/OpenBSD/7.8/amd64
            tree -h -D -C -H -./ --houtro=/dev/null -T 'Gershwin System for OpenBSD 7.8 amd64' ./ > ./index.html || true
            exit 0

      - uses: actions/upload-artifact@v6
        with:
          name: gershwin-openbsd-78-amd64
          path: artifacts/OpenBSD/7.8/amd64
          if-no-files-found: error

      # The JUnit report (build/test-results/junit.xml) is written by the
      # uitest harness and copied out of the VM by run-uitests.sh. Upload it
      # so CI consumers can download it without scraping the log.
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-openbsd-78-amd64
          path: build/test-results/*
          if-no-files-found: warn

      # Publish the JUnit report as a check run / PR annotation so the results
      # are visible in the Actions UI without downloading the artifact.
      - name: Publish UI test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: GNUstep UI tests (OpenBSD)
          path: build/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true
